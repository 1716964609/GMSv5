apiVersion: 1

datasources:
  - name: CloudWatch
    uid: gms-cloudwatch
    type: cloudwatch
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      authType: default
      defaultRegion: ap-northeast-1
      customMetricsNamespaces: GMS/Availability
      endpoint: https://monitoring.ap-northeast-1.api.aws
      proxyType: env
