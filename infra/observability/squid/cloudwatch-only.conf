http_port 172.18.0.1:3128

acl grafana_client src 172.18.0.7/32
acl cloudwatch_api dstdomain monitoring.ap-northeast-1.api.aws
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow grafana_client cloudwatch_api CONNECT
http_access deny all

cache deny all
