name: CI Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04-arm
    env:
      GMS_BUILD_SHA: ${{ github.sha }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Deployment engine tests
        run: python3 -B -m unittest discover -s infra/deployment/tests -p 'test_*.py' -v

      - name: Availability and deployment monitoring tests
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python3.12 -m venv "$RUNNER_TEMP/availability-tests"

          "$RUNNER_TEMP/availability-tests/bin/python" -m pip install \
            -r infra/terraform/availability/requirements-test.txt

          "$RUNNER_TEMP/availability-tests/bin/python" -B -m unittest discover \
            -s infra/terraform/availability/tests \
            -p 'test_*.py' -v

      - name: Production build
        run: npm run build

      - name: Verify standalone output
        run: test -f .next/standalone/server.js

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install verified Trivy CLI
        shell: bash
        run: |
          set -euo pipefail

          VERSION="0.76.2"
          ARCHIVE="trivy_${VERSION}_Linux-64bit.tar.gz"
          EXPECTED_SHA256="bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${ARCHIVE}"

          echo "${EXPECTED_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check -

          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/trivy" trivy

          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Scan repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p trivy-reports

          trivy fs \
            --scanners vuln,misconfig,secret \
            --format json \
            --output trivy-reports/trivy.json \
            --exit-code 0 \
            --no-progress \
            .

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-reports/trivy.json
          if-no-files-found: warn
          retention-days: 14
